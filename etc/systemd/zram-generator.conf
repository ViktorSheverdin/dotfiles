# Compressed swap living in RAM (zram).
#
# Why: this machine had NO swap at all. When RAM filled up, the kernel had
# nowhere to put cold pages, so it thrashed page cache until the desktop froze
# and needed a hard reboot. zram gives the kernel a place to park idle memory
# (old browser tabs, idle LSP heaps) compressed ~3:1 with zstd, so 16G of zram
# usually costs only ~5G of real RAM when full.
#
# Installed by scripts/memory-setup.sh -> /etc/systemd/zram-generator.conf
# Check after reboot:  zramctl   /   swapon --show

[zram0]
zram-size = ram / 2
compression-algorithm = zstd
swap-priority = 100
fs-type = swap

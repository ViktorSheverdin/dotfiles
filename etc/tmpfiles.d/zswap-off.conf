# Disable zswap at boot. Arch kernels enable zswap by default, but zswap is a
# compressed cache in front of a *disk* swap. With zram as the only swap it
# just compresses pages twice. Arch Wiki: disable zswap when using zram.
# Installed by scripts/memory-setup.sh -> /etc/tmpfiles.d/zswap-off.conf
w- /sys/module/zswap/parameters/enabled - - - - N

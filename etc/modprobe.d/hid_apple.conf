# Keychron K4 in Mac mode enumerates over USB as a genuine Apple keyboard,
# so Linux drives it with the hid_apple kernel module instead of hid_generic.
# That module's own fnmode option decides whether bare F1-F12 send real
# function keys or the printed media functions (brightness/volume/etc).
#
# fnmode=2 (fkeysfirst): bare F-keys send real F1-F12 by default, hold Fn
# for the media row instead. Without this, bare F5 was being swallowed as
# a brightness key before nvim/tmux/anything else ever saw a keystroke,
# which broke nvim-dap's default F5/F10/F11/F12 debugger keymaps.
#
# Not symlinked by `stow .` (that only targets ~) — copy this file to
# /etc/modprobe.d/hid_apple.conf manually, then reload the module:
#   sudo cp etc/modprobe.d/hid_apple.conf /etc/modprobe.d/hid_apple.conf
#   sudo rmmod hid_apple && sudo modprobe hid_apple
options hid_apple fnmode=2

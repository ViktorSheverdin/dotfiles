# Kernel memory tuning for zram swap.
# Values from the Arch Wiki "zram" page (tuned for swap that lives in RAM).
# Installed by scripts/memory-setup.sh -> /etc/sysctl.d/99-memory.conf
# Inspect live values:  sysctl vm.swappiness vm.page-cluster

# Swap to zram eagerly. Swapping to compressed RAM is far cheaper than
# dropping file cache and re-reading it from disk. (>100 is valid since 5.8.)
vm.swappiness = 180

# Read/write one page at a time. Readahead makes sense for disks, not for RAM.
vm.page-cluster = 0

# Start reclaiming memory earlier and in a smoother way, instead of letting
# free memory hit zero and then stalling everything at once.
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125

# Emergency keys (Magic SysRq). If the desktop ever freezes anyway:
#   Alt + PrintScreen + F   -> kernel OOM-kills the biggest process NOW
#   Alt + PrintScreen + R,E,I,S,U,B (slowly) -> safe reboot instead of power button
# 244 = keyboard control + sync + remount-ro + signals/oom-kill + reboot.
kernel.sysrq = 244
